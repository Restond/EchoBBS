plugins {
    id 'java'
    id 'org.springframework.boot' version('4.0.6')
    id 'io.spring.dependency-management' version('1.1.7')
}

group = 'com.restond'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web:4.0.6'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa:4.0.6'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf:4.0.6'
    implementation 'org.springframework.boot:spring-boot-starter-security:4.0.6'
    implementation 'org.springframework.boot:spring-boot-starter-validation:4.0.6'
    implementation 'org.springframework.boot:spring-boot-starter-cache:4.0.6'

    // Database
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql:42.7.11'

    // databind
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.0'

    // Cache
    implementation 'com.github.ben-manes.caffeine:caffeine:3.2.4'

    // Markdown
    implementation 'org.commonmark:commonmark:0.28.0'

    // HTML Sanitizer
    implementation 'org.jsoup:jsoup:1.22.2'

    // Image
    implementation 'net.coobird:thumbnailator:0.4.21'

    implementation 'org.webjars.npm:simplemde:1.11.2'

    implementation 'com.bucket4j:bucket4j-core:8.10.1'

    implementation 'org.springframework.boot:spring-boot-starter-actuator'

}
test {
    useJUnitPlatform()
}