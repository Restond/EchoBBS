server:
  port: 8081
  servlet:
    session:
      timeout: 7d

spring:
  application:
    name: echobbs

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:echobbs}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false

  thymeleaf:
    cache: false
    mode: HTML

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

  mvc:
    throw-exception-if-no-handler-found: true

logging:
  level:
    root: INFO
    com.restond.echobbs: INFO
    com.restond.echobbs.common.GlobalExceptionHandler: WARN
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/echobbs.log
    max-size: 10MB
    max-history: 30

app:
  upload:
    avatar-dir: uploads/avatars
    image-dir: uploads/images
  view-count:
    flush-interval: 180000
  cors:
    # 生产环境改为实际前端域名，如 https://echobbs.example.com
    allowed-origins: http://localhost:3000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized